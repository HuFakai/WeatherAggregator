<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聚合天气管理后台</title>
    <link rel="stylesheet" href="/static/css/admin.css?v=8">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="background-mesh"></div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal center-modal" style="display: flex;">
        <div class="modal-content glass-card login-card">
            <div class="login-header">
                <div class="logo-icon-lg">
                    <i data-lucide="cloud-sun"></i>
                </div>
                <h2>欢迎回来</h2>
                <p class="subtitle">请输入管理员密钥以访问控制台</p>
            </div>

            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i data-lucide="key" class="input-icon"></i>
                    <input type="password" id="adminKeyInput" placeholder="Admin Key" class="glass-input">
                </div>
            </div>
            <button id="loginBtn" class="btn-primary" style="width: 100%">
                <span>登录系统</span>
                <i data-lucide="arrow-right" class="btn-icon-right"></i>
            </button>
            <p id="loginError" class="error-msg"></p>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <i data-lucide="cloud-lightning"></i>
                </div>
                <h1>Weather<br>Aggregator</h1>
            </div>

            <nav class="main-nav">
                <button class="nav-item active" data-tab="clients">
                    <i data-lucide="users"></i>
                    <span>客户端密钥</span>
                </button>
                <button class="nav-item" data-tab="channels">
                    <i data-lucide="globe"></i>
                    <span>数据渠道</span>
                </button>
                <div class="nav-spacer"></div>
                <button id="logoutBtn" class="nav-item danger-item">
                    <i data-lucide="log-out"></i>
                    <span>退出登录</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="version-badge">v1.0.0</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <div class="header-title">
                    <h2 id="pageTitle">仪表盘概览</h2>
                    <p id="pageSubtitle">实时监控与管理系统数据</p>
                </div>
                <div class="header-actions">
                    <div class="current-time" id="currentTime">--:--</div>
                </div>
            </header>

            <!-- Global Stats Overview -->
            <div class="dashboard-grid">
                <div class="stat-card glass-card purple-gradient">
                    <div class="stat-icon-bg">
                        <i data-lucide="activity"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">今日总调用</div>
                        <div class="stat-value" id="totalClientUsage">--</div>
                    </div>
                </div>

                <!-- Channel stats will be injected here -->
                <div id="channelOverview" class="channel-stats-wrapper">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Client Keys Section -->
            <div id="section-clients" class="tab-section active-section">
                <div class="section-toolbar">
                    <div class="toolbar-left">
                        <!-- Search Removed -->
                    </div>
                    <button class="btn-primary" onclick="openAddClientKey()">
                        <i data-lucide="plus"></i>
                        <span>新建密钥</span>
                    </button>
                </div>

                <div id="clientKeyList" class="card-grid">
                    <!-- Client keys render here -->
                </div>
            </div>

            <!-- Channel Config Section -->
            <div id="section-channels" class="tab-section" style="display: none;">
                <div class="section-toolbar">
                    <span class="toolbar-label">渠道配置列表</span>
                </div>
                <div id="channelList" class="stack-grid">
                    <!-- Channels render here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Create Client Key Modal -->
    <div id="createKeyModal" class="modal center-modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>新建客户端密钥</h3>
                <button class="close-btn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>名称标识</label>
                    <input type="text" id="newKeyName" placeholder="例如: 移动端 APP" class="glass-input">
                </div>
            </div>
            <div class="modal-footer">
                <button id="submitCreateKey" class="btn-primary">
                    <i data-lucide="check"></i> 确认创建
                </button>
            </div>
        </div>
    </div>

    <!-- Add Channel Key Modal -->
    <div id="addChannelKeyModal" class="modal center-modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>添加渠道 API Key</h3>
                <button class="close-btn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>API Key / Token</label>
                    <input type="text" id="newChannelKey" placeholder="输入服务提供商的 Key" class="glass-input">
                    <p class="hint">和风/百度格式通常为 ID|Key 或 AK|SK</p>
                </div>
                <div class="form-group">
                    <label>每日请求限额</label>
                    <input type="number" id="newChannelLimit" value="2000" class="glass-input">
                </div>
                <div class="form-group">
                    <label>备注描述</label>
                    <input type="text" id="newChannelDesc" placeholder="例如: 备用账号 #1" class="glass-input">
                </div>
            </div>
            <div class="modal-footer">
                <button id="submitAddChannelKey" class="btn-primary">
                    <i data-lucide="plus-circle"></i> 确认添加
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Client Key Modal -->
    <div id="editKeyModal" class="modal center-modal">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>编辑密钥配置</h3>
                <button class="close-btn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editKeyId">
                <div class="form-group">
                    <label>QPM 速率限制 (0 为不限)</label>
                    <input type="number" id="editKeyQpm" class="glass-input">
                </div>
                <div class="form-group">
                    <label>IP 白名单 (每行一个)</label>
                    <textarea id="editKeyIpList" rows="4" class="glass-textarea"
                        placeholder="192.168.1.1&#10;10.0.0.1"></textarea>
                </div>
                <div class="form-group checkbox-wrapper">
                    <label class="switch">
                        <input type="checkbox" id="editKeyIpEnabled">
                        <span class="slider round"></span>
                    </label>
                    <span class="label-text">启用 IP 白名单验证</span>
                </div>
            </div>
            <div class="modal-footer">
                <button id="submitEditKey" class="btn-primary">
                    <i data-lucide="save"></i> 保存配置
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js?v=6"></script>
    <script>
        // Initialize Icons
        lucide.createIcons();
    </script>
</body>

</html>
